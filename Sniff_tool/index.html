
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Bongkar M3U</title>
    <style>
        /* Gaya umum */
        body {
            font-family: Arial, sans-serif;
            background-color: #F8F8FF;
            background-image: url('https://balatack.my.id/background_Sniff.gif'); /* Ganti dengan URL gambar bintang */
            background-size: cover;
            background-position: center;
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 50px;
            color: #00FF00;
            animation: blink-animation 1s steps(5, start) infinite;
        }

        @keyframes blink-animation {
            0%, 100% { visibility: hidden; }
            50% { visibility: visible; }
        }

        /* Styling untuk form M3U */
        #m3uFormSection {
            width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8); /* Latar belakang semi-transparan agar teks tetap terbaca */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #m3uForm {
            font-size: 14px;
        }

        #m3uForm input[type="text"] {
            width: calc(100% - 16px);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            border: 2px solid #ccc;
            box-sizing: border-box;
            animation: moveInput 2s linear infinite;
        }

        /* Tambahkan animasi border warna-warni pada kolom URL */
        #m3uUrl {
            border-color: #FF6347; /* Warna border merah */
            border-width: 3px;
            border-radius: 10px;
            animation: rainbow-border 3s linear infinite;
        }

        /* Animasi border berwarna-warni */
        @keyframes rainbow-border {
            0% { border-color: #FF6347; }
            25% { border-color: #FF1493; }
            50% { border-color: #00BFFF; }
            75% { border-color: #32CD32; }
            100% { border-color: #FF6347; }
        }

        /* Animasi bergerak pada input dan tombol */
        @keyframes moveInput {
            0% {
                transform: translateX(0);
                background-color: #fff;
            }
            50% {
                transform: translateX(10px);
                background-color: #e0f7fa;
            }
            100% {
                transform: translateX(0);
                background-color: #fff;
            }
        }

        button {
            background-color: #00FF00;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            animation: moveButton 2s linear infinite;
        }

        @keyframes moveButton {
            0% {
                transform: translateX(0);
                background-color: #00FF00;
            }
            50% {
                transform: translateX(-10px);
                background-color: #ffeb3b;
            }
            100% {
                transform: translateX(0);
                background-color: #00FF00;
            }
        }

        /* Styling untuk div hasil */
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 4px;
            display: none;
        }

        /* Spinner loading */
        #loadingSpinner {
            display: none;
            text-align: center;
        }

        #loadingSpinner::before {
            content: '';
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Styling untuk hak pemilik */
        #ownerInfo {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        /* Styling untuk QRIS */
        #qrisSection {
            text-align: center;
            margin-top: 30px;
        }

        #qrisSection img {
            width: 150px; /* Sesuaikan ukuran logo QRIS */
            cursor: pointer;
        }

        /* Animasi teks berjalan */
        @keyframes scrollText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Styling untuk teks berjalan */
        #donasiText {
            display: inline-block;
            font-size: 18px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            animation: scrollText 8s linear infinite;
        }
    </style>
</head>
<body>
    <h1>SNIFF TOOLS</h1>

    <!-- Form M3U -->
    <div id="m3uFormSection">
        <form id="m3uForm">
            <label for="m3uUrl">input URL PLAYLIST:</label><br>
            <input type="text" name="m3uUrl" id="m3uUrl" placeholder="URL M3U" required><br><br>

            <label for="userAgent">input User-Agent:</label><br>
            <input type="text" name="userAgent" id="userAgent" placeholder="Masukkan User-Agent" required><br><br>

            <label for="activationCode">input Kode Langganan Anda:</label><br>
            <input type="text" name="activationCode" id="activationCode" placeholder="Kode Aktivasi" required><br><br>

            <button type="submit">GET BRO</button>
        </form>

        <!-- Spinner loading -->
        <div id="loadingSpinner"></div>

        <div id="result"></div>
    </div>

    <!-- QRIS Donasi Section -->
    <div id="qrisSection">
        <p><span id="donasiText">Silakan Donasi Seikhlas nya untuk mendapatkan kode aktivasi:</span></p>
        <a href="https://balatack.my.id/Donasi.jpg" target="white">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIOKwEHgUEKTaJOv1l86HdfAepBChB8TYwyw&usqp=CAU" alt="Donasi QRIS">
        </a>
    </div>

    <!-- Informasi Hak Pemilik -->
    <div id="ownerInfo">
        <p>Hak Cipta &copy; 2025. Semua hak dilindungi </p>
    </div>

    <script>
        // Tentukan kode aktivasi yang valid
        var validActivationCode = "635241"; // Ganti dengan kode aktivasi yang valid

        // Script untuk proses form M3U
        document.getElementById('m3uForm').addEventListener('submit', function(event) {
            event.preventDefault();  // Mencegah form dari submit biasa

            var m3uUrl = document.getElementById('m3uUrl').value;
            var userAgent = document.getElementById('userAgent').value;
            var activationCode = document.getElementById('activationCode').value;

            // Cek apakah semua data sudah diisi
            if (!m3uUrl || !userAgent || !activationCode) {
                alert("Harap masukkan semua data!");
                return;
            }

            // Verifikasi kode aktivasi
            if (activationCode !== validActivationCode) {
                alert("Kode aktivasi salah! Silakan masukkan kode yang benar.");
                return;
            }

            // Tampilkan spinner loading
            document.getElementById('loadingSpinner').style.display = 'block';

            // Buat data untuk dikirim
            var formData = new FormData();
            formData.append('m3uUrl', m3uUrl);
            formData.append('userAgent', userAgent);
            formData.append('activationCode', activationCode);

            // Buat request AJAX
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'process.php', true);

            xhr.onload = function() {
                // Sembunyikan spinner loading
                document.getElementById('loadingSpinner').style.display = 'none';

                if (xhr.status === 200) {
                    // Menampilkan hasil ke dalam div #result
                    document.getElementById('result').style.display = 'block';
                    document.getElementById('result').innerHTML = xhr.responseText;
                } else {
                    alert('Terjadi kesalahan: ' + xhr.statusText);
                }
            };

            // Menambahkan error handler
            xhr.onerror = function() {
                alert('Terjadi kesalahan jaringan.');
            };

            // Kirim data ke server
            xhr.send(formData);
        });
    </script>
</body>
</html>
